<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quán Ăn Chợ Nổi — v1.0.0</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #0e141a; color: #eef4f7;
    font: 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  body.hc { background: #000000; color: #ffffff; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .toolbar {
    position: fixed; top: 8px; right: 12px; display: flex; gap: 8px; z-index: 20;
  }
  .btn {
    background: #1b2836; color: #fff; border: 2px solid #4fc3f7; border-radius: 6px;
    padding: 6px 12px; font-size: 16px; cursor: pointer; font-weight: 600;
  }
  body.hc .btn { background: #000; color: #ffff00; border-color: #ffffff; }
  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.72);
    display: flex; align-items: center; justify-content: center; z-index: 30;
  }
  .card {
    background: #182430; border: 2px solid #80deea; border-radius: 12px;
    padding: 24px 32px; max-width: 620px; text-align: center;
  }
  body.hc .card { background: #000; border: 3px solid #ffffff; color: #fff; }
  .hidden { display: none !important; }
  .shop-row { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
  .sfx-sub {
    position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%);
    background: rgba(12, 20, 28, 0.85); color: #ffe082; border: 1px solid #ffd54f;
    padding: 4px 14px; border-radius: 6px; font-size: 18px; pointer-events: none; z-index: 15;
  }
</style>
</head>
<body>
<div class="toolbar">
  <button id="hcBtn" class="btn" onclick="toggleHC()">Tương phản cao (C)</button>
  <button id="muteBtn" class="btn" onclick="toggleMute()">Âm thanh: Bật (M)</button>
  <button id="pauseBtn" class="btn" onclick="sendPause()">Tạm dừng (Esc/P)</button>
</div>
<div id="sfxSub" class="sfx-sub hidden"></div>

<div id="menuModal" class="modal hidden">
  <div class="card">
    <h1>Quán Ăn Chợ Nổi</h1>
    <p>Lặn sông miền Tây — phục vụ thực khách — nâng cấp ghe xuồng.</p>
    <div class="shop-row">
      <button class="btn" onclick="startGame()">Chơi</button>
      <button class="btn" onclick="quitToBye()">Thoát</button>
    </div>
  </div>
</div>

<div id="pauseModal" class="modal hidden">
  <div class="card">
    <h2>Đang tạm dừng</h2>
    <div class="shop-row">
      <button class="btn" onclick="sendPause()">Tiếp tục</button>
      <button class="btn" onclick="openMenu()">Về menu</button>
    </div>
  </div>
</div>

<div id="shopModal" class="modal hidden">
  <div class="card">
    <h2 id="shopTitle">Cửa hàng cuối ngày</h2>
    <p id="shopInfo">Tiền: 0k</p>
    <div class="shop-row">
      <button class="btn" onclick="buyUpgrade('oxygen')">Bình Oxy</button>
      <button class="btn" onclick="buyUpgrade('hp')">Áo Phao</button>
      <button class="btn" onclick="finishShop()">Xong Shop</button>
    </div>
  </div>
</div>

<canvas id="c"></canvas>
<script>
const c = document.getElementById("c"), ctx = c.getContext("2d");
let snap = null, offline = false, log = [], lastEventKey = "";
let highContrast = false, muted = false, inMenu = false, lastPhase = null, bannerMsg = "", bannerUntil = 0;

function toggleHC() {
  highContrast = !highContrast;
  document.body.classList.toggle("hc", highContrast);
}
function toggleMute() {
  muted = !muted;
  document.getElementById("muteBtn").textContent = muted ? "Âm thanh: Tắt (M)" : "Âm thanh: Bật (M)";
}
function openMenu() { inMenu = true; document.getElementById("menuModal").classList.remove("hidden"); document.getElementById("pauseModal").classList.add("hidden"); }
function startGame() { inMenu = false; document.getElementById("menuModal").classList.add("hidden"); if (snap && snap.state === "paused") sendPause(); }
function quitToBye() { document.getElementById("menuModal").querySelector("p").textContent = "Cảm ơn bạn đã ghé Quán Ăn Chợ Nổi! Nhấn Chơi để vào lại."; }

function beep(freq) {
  if (muted) return;
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.frequency.value = freq; g.gain.value = 0.05;
    osc.connect(g); g.connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime + 0.08);
  } catch {}
}

const SFX_LABELS = {
  gather: ["🌿 Hái nguyên liệu", 620],
  fish_caught: ["🐟 Bắt trọn đàn cá", 760],
  monster_hit: ["🐊 Thủy quái tấn công!", 180],
  spoiled: ["🤢 Nguyên liệu bị ươn!", 240],
  dish_burnt: ["🔥 Món trên bếp bị cháy!", 200],
  served: ["🍲 Phục vụ khách xong", 700],
  paid: ["💰 Khách thanh toán!", 880],
  bought: ["🛠 Đã mua nâng cấp", 800],
};

// ---------- input ----------
const keys = new Set(), ONE = { KeyE: "interact", Space: "catch", KeyP: "pause", Escape: "pause", Enter: "shop_done" };
let held = { interact: false, catch: false, pause: false, shop_done: false }, pending = {};
const bodyInput = () => {
  const mv = [(keys.has("ArrowRight") || keys.has("KeyD")) - (keys.has("ArrowLeft") || keys.has("KeyA")),
              (keys.has("ArrowDown") || keys.has("KeyS")) - (keys.has("ArrowUp") || keys.has("KeyW"))];
  const o = { move: mv };
  for (const k in pending) { o[k] = pending[k]; held[k] = pending[k]; }
  pending = {};
  return o;
};
function post(url, body) {
  return fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
                 body: JSON.stringify(body) }).catch(() => {});
}
function sendPause() { post("/input", { pause: true }).then(() => post("/input", { pause: false })); }
function buyUpgrade(u) { post("/input", { buy: u }); }
function finishShop() { post("/input", { shop_done: true }).then(() => post("/input", { shop_done: false })); }

addEventListener("keydown", (e) => {
  if (e.code === "KeyC") { toggleHC(); return; }
  if (e.code === "KeyM") { toggleMute(); return; }
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  if (e.code === "KeyR" && !e.repeat) { post("/restart", {}); return; }
  keys.add(e.code);
  const b = ONE[e.code];
  if (b && !e.repeat && !held[b]) pending[b] = true;
});
addEventListener("keyup", (e) => {
  keys.delete(e.code);
  const b = ONE[e.code];
  if (b && held[b]) pending[b] = false;
});
addEventListener("blur", () => { keys.clear(); pending = { interact: false, catch: false, pause: false, shop_done: false }; });

async function pushInput() { await post("/input", bodyInput()); }
setInterval(pushInput, 50);

async function pullState() {
  try {
    const r = await fetch("/state");
    snap = await r.json();
    offline = false;
    const evs = snap.events || [];
    if (evs.length) {
      const tail = evs[evs.length - 1];
      const key = `${tail.tick}:${tail.name}:${JSON.stringify(tail.data)}`;
      if (key !== lastEventKey) {
        lastEventKey = key;
        if (SFX_LABELS[tail.name]) {
          const [msg, fq] = SFX_LABELS[tail.name];
          bannerMsg = msg; bannerUntil = performance.now() + 2500;
          beep(fq);
        }
      }
      log = evs.slice(-6).reverse();
    }
    const pm = document.getElementById("pauseModal");
    pm.classList.toggle("hidden", snap.state !== "paused" || inMenu);
    const sm = document.getElementById("shopModal");
    const showShop = (snap.phase === "shop") && snap.state === "playing" && !inMenu;
    sm.classList.toggle("hidden", !showShop);
    if (showShop) {
      document.getElementById("shopTitle").textContent = `Cửa hàng cuối Ngày ${snap.day || 1} (còn ${Math.ceil((snap.time_left_ticks || 0)/60)}s)`;
      const up = snap.upgrades || {};
      document.getElementById("shopInfo").textContent = `Tiền: ${snap.money || 0}k · Oxy cấp ${up.oxygen || 0} · Áo phao cấp ${up.hp || 0}`;
    }
    if (snap.phase && snap.phase !== lastPhase) {
      if (snap.phase === "gather") bannerMsg = `📅 Bắt đầu Ngày ${snap.day || 1} — Lặn & Hái`;
      else if (snap.phase === "quan") bannerMsg = `🏮 Mở Quán Ngày ${snap.day || 1}`;
      bannerUntil = performance.now() + 4000;
      lastPhase = snap.phase;
    }
    const subEl = document.getElementById("sfxSub");
    if (performance.now() < bannerUntil && bannerMsg) {
      subEl.textContent = bannerMsg; subEl.classList.remove("hidden");
    } else {
      subEl.classList.add("hidden");
    }
  } catch { offline = true; }
}
setInterval(pullState, 50);

// ---------- vẽ ----------
const KIND_COLOR = { ca_loc: "#7c9a52", ca_linh: "#d6e6f2", ca_keo: "#d9a066", bong_dien_dien: "#f2c230", bong_sung: "#e8799c", keo_neo: "#8fcf6b" };
const KIND_NAME = { ca_loc: "cá lóc", ca_linh: "cá linh", ca_keo: "cá kèo", bong_dien_dien: "điên điển", bong_sung: "bông súng", keo_neo: "kèo nèo" };
const kc = (k) => KIND_COLOR[k] || "#bbbbbb";

function fit() {
  const dpr = devicePixelRatio || 1, w = innerWidth, h = innerHeight;
  if (c.width !== w * dpr || c.height !== h * dpr) { c.width = w * dpr; c.height = h * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return [w, h];
}
function text(s, x, y, { size = 18, color = "#fff", align = "left" } = {}) {
  ctx.fillStyle = highContrast && color !== "#111" ? "#ffffff" : color;
  ctx.font = `bold ${size}px system-ui, sans-serif`;
  ctx.textAlign = align;
  ctx.fillText(s, x, y);
}
function bar(x, y, w, h, ratio, color, label) {
  ctx.fillStyle = highContrast ? "#000000" : "rgba(0,0,0,.45)";
  ctx.fillRect(x, y, w, h);
  if (highContrast) { ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h); }
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w * Math.max(0, Math.min(1, ratio)), h);
  if (label) text(label, x + w / 2, y + h - 5, { size: 18, align: "center", color: "#fff" });
}
const fmtTime = (ticks) => {
  const s = Math.max(0, Math.ceil((ticks || 0) / 60));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
};

// ----- cảnh LẶN & HÁI -----
function drawGather(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 100], d: [0, 30] };
  const X = b.x[1], D = b.d[1], SKY = 6;
  const top = 76, bottom = 92;
  const s = Math.min(w / X, (h - top - bottom) / (D + SKY));
  const ox = (w - s * X) / 2, oy = top + SKY * s;
  const sx = (x) => ox + x * s, sy = (d) => oy + d * s;

  if (highContrast) {
    ctx.fillStyle = "#000000"; ctx.fillRect(sx(0), oy, X * s, D * s);
    ctx.fillStyle = "#111111"; ctx.fillRect(sx(0), top, X * s, SKY * s);
    ctx.strokeStyle = "#00ffcc"; ctx.lineWidth = 3;
  } else {
    const skyG = ctx.createLinearGradient(0, top, 0, oy);
    skyG.addColorStop(0, "#b8e0f2"); skyG.addColorStop(1, "#e2f3fb");
    ctx.fillStyle = skyG; ctx.fillRect(sx(0), top, X * s, SKY * s);
    const seaG = ctx.createLinearGradient(0, oy, 0, sy(D));
    seaG.addColorStop(0, "#23739b"); seaG.addColorStop(0.5, "#154b6e"); seaG.addColorStop(1, "#0b263d");
    ctx.fillStyle = seaG; ctx.fillRect(sx(0), oy, X * s, D * s);
    ctx.strokeStyle = "#e9f7ff"; ctx.lineWidth = 2;
  }
  ctx.beginPath(); ctx.moveTo(sx(0), oy); ctx.lineTo(sx(X), oy); ctx.stroke();

  for (const d of [10, 20]) {
    ctx.strokeStyle = highContrast ? "rgba(255,255,255,0.4)" : "rgba(255,255,255,.1)";
    ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(sx(0), sy(d)); ctx.lineTo(sx(X), sy(d)); ctx.stroke();
  }

  const dp = meta.dock_pos || [2, 0], dr = meta.dock_radius || 3;
  ctx.fillStyle = "#b9503a";
  ctx.beginPath(); ctx.moveTo(sx(dp[0] - 1.8), sy(-0.7)); ctx.lineTo(sx(dp[0]), sy(-2.4)); ctx.lineTo(sx(dp[0] + 1.8), sy(-0.7)); ctx.fill();
  ctx.strokeStyle = "#ffe082"; ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.arc(sx(dp[0]), sy(dp[1]), dr * s, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);

  (snap.nodes || []).forEach((n) => {
    ctx.globalAlpha = n.ready ? 1 : 0.3;
    ctx.fillStyle = kc(n.kind); ctx.beginPath(); ctx.ellipse(sx(n.pos[0]), sy(n.pos[1]) - 0.1 * s, 0.9 * s, 0.4 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  });

  (snap.fish || []).forEach((f) => {
    ctx.save(); ctx.translate(sx(f.pos[0]), sy(f.pos[1])); ctx.rotate(((f.heading_deg || 0) * Math.PI) / 180);
    ctx.fillStyle = kc(f.kind);
    ctx.beginPath(); ctx.ellipse(0, 0, 0.9 * s, 0.45 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });

  let monsterNear = false;
  (snap.monsters || []).forEach((m) => {
    const mx = sx(m.pos[0]), my = sy(m.pos[1]);
    ctx.fillStyle = m.state === "chase" ? "#ff1744" : "#4a6b3a";
    ctx.beginPath(); ctx.ellipse(mx, my, 1.3 * s, 0.55 * s, 0, 0, Math.PI * 2); ctx.fill();
    text("🐊 " + m.id, mx, my - 0.8 * s, { size: 18, align: "center", color: "#fff" });
    if (snap.player && Math.hypot(snap.player.pos[0] - m.pos[0], snap.player.pos[1] - m.pos[1]) <= 10.0) {
      monsterNear = true;
    }
  });
  if (monsterNear) {
    ctx.strokeStyle = highContrast ? "#ffff00" : "#9c27b0"; ctx.lineWidth = 8; ctx.strokeRect(4, 4, w - 8, h - 8);
    text("⚠ Thủy quái!", w / 2, 110, { size: 24, align: "center", color: "#ffeb3b" });
  }

  const p = snap.player;
  let lowOxy = false;
  if (p) {
    const px = sx(p.pos[0]), py = sy(p.pos[1]);
    ctx.fillStyle = highContrast ? "#ffff00" : "#ff8a3d";
    ctx.beginPath(); ctx.arc(px, py, 0.65 * s, 0, Math.PI * 2); ctx.fill();
    lowOxy = p.oxygen_max_ticks && (p.oxygen_ticks / p.oxygen_max_ticks < 0.25);
    if (lowOxy) {
      text("🫧 Hết hơi!", w / 2, 142, { size: 24, align: "center", color: "#ff5252" });
    }
  }

  const lowTime = (snap.time_left_ticks || 0) <= 30 * 60;
  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 34, { size: 22, color: lowTime ? "#ff5252" : "#fff" });
  if (p && p.oxygen_max_ticks) {
    bar(115, 14, 240, 26, p.oxygen_ticks / p.oxygen_max_ticks, lowOxy ? "#ef5350" : "#4fc3f7", `Oxy ${Math.ceil(p.oxygen_ticks / 60)}s`);
  }
  if (p && p.hp_max) {
    let hs = "";
    for (let i = 0; i < p.hp_max; i++) hs += i < p.hp ? "♥ " : "♡ ";
    text(hs, 375, 34, { size: 22, color: "#ef5350" });
    text(`Độ sâu: ${p.pos[1].toFixed(1)}m · Ngày ${snap.day || 1}`, 510, 34, { size: 18 });
  }

  if (snap.hold && snap.hold_capacity) {
    const cap = snap.hold_capacity, sz = Math.min(34, (w - 280) / cap - 4), y0 = h - bottom + 8;
    for (let i = 0; i < cap; i++) {
      const x0 = 14 + i * (sz + 4);
      ctx.fillStyle = "rgba(255,255,255,.15)"; ctx.fillRect(x0, y0, sz, sz);
      if (snap.hold[i]) {
        const it = snap.hold[i];
        ctx.fillStyle = kc(typeof it === "string" ? it : it.kind);
        ctx.fillRect(x0 + 3, y0 + 3, sz - 6, sz - 6);
        if (typeof it === "object" && it.fresh !== undefined && it.fresh < 30) {
          ctx.strokeStyle = "#ff5252"; ctx.lineWidth = 3; ctx.strokeRect(x0, y0, sz, sz);
        }
      }
    }
    text(`Giỏ ${snap.hold.length}/${cap}`, 14, y0 + sz + 24, { size: 18, color: "#cfd8dc" });
  }
  text("WASD bơi · E hái/bến · Space bắt · C tương phản · R chơi lại", w - 12, h - 14, { size: 18, align: "right", color: "#9fb3c0" });
}

// ----- cảnh QUÁN -----
function drawQuan(w, h) {
  const meta = snap.meta || {};
  const b = meta.bounds || { x: [0, 16], z: [0, 10] };
  const X = b.x[1], Z = b.z[1], top = 76, bottom = 52;
  const s = Math.max(1, Math.min((w - 40) / X, (h - top - bottom) / Z));
  const ox = (w - s * X) / 2, oy = top;
  const sx = (x) => ox + x * s, sy = (z) => oy + (Z - z) * s;

  ctx.fillStyle = highContrast ? "#000000" : "#c9a36b"; ctx.fillRect(sx(0), sy(Z), X * s, Z * s);
  ctx.strokeStyle = highContrast ? "#ffffff" : "#6b4a2b"; ctx.lineWidth = 4; ctx.strokeRect(sx(0), sy(Z), X * s, Z * s);

  (snap.stoves || []).forEach((st) => {
    const col = st.state === "cooking" ? "#e8892b" : st.state === "ready" ? "#6fbf5a" : "#6d6d72";
    ctx.fillStyle = col; ctx.fillRect(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) - 0.8 * s, 1.6 * s, 1.6 * s);
    text(st.id, sx(st.pos[0]), sy(st.pos[1]) + 6, { size: 18, align: "center", color: "#111" });
    if (st.state === "ready" && meta.burn_s) {
      const left = Math.max(0, meta.burn_s * 60 - (st.ready_ticks || 0));
      bar(sx(st.pos[0]) - 0.8 * s, sy(st.pos[1]) + 0.9 * s, 1.6 * s, 8, left / (meta.burn_s * 60), left < 300 ? "#ef5350" : "#ffd54f");
    }
  });

  const patMax = (meta.patience_s || 60) * 60, byTable = {};
  (snap.customers || []).forEach((c) => (byTable[c.table_id] = c));
  let urgentCustomer = false;
  (snap.tables || []).forEach((tb) => {
    ctx.fillStyle = "#8a5a2e"; ctx.beginPath(); ctx.arc(sx(tb.pos[0]), sy(tb.pos[1]), 0.9 * s, 0, Math.PI * 2); ctx.fill();
    const cust = byTable[tb.id];
    if (cust) {
      const cx = sx(tb.pos[0]), cy = sy(tb.pos[1]);
      ctx.fillStyle = cust.state === "eating" ? "#7bc67b" : "#f4b6c2";
      ctx.beginPath(); ctx.arc(cx, cy, 0.55 * s, 0, Math.PI * 2); ctx.fill();
      const pat = cust.patience_ticks_left ?? patMax;
      const ratio = pat / patMax;
      if (cust.state === "waiting" && ratio < 0.25) urgentCustomer = true;
      bar(cx - 0.9 * s, cy + 0.7 * s, 1.8 * s, 8, ratio, ratio < 0.25 ? "#ff1744" : "#80cbc4");
    }
  });
  if (urgentCustomer) {
    text("😠 Khách sắp giận!", w / 2, 110, { size: 24, align: "center", color: "#ff5252" });
  }

  if (snap.player) {
    const px = sx(snap.player.pos[0]), py = sy(snap.player.pos[1]);
    ctx.fillStyle = highContrast ? "#ffff00" : "#ff8a3d"; ctx.beginPath(); ctx.arc(px, py, 0.55 * s, 0, Math.PI * 2); ctx.fill();
    if (snap.hand) {
      const hd = typeof snap.hand === "string" ? snap.hand : (snap.hand.dish_id || "món");
      text("🍲 " + hd, px, py - 0.8 * s, { size: 18, align: "center", color: "#fff" });
    }
  }

  text("⏱ " + fmtTime(snap.time_left_ticks), 14, 34, { size: 22 });
  text(`Tiền ${snap.money ?? 0}k · uy tín ${(snap.reputation ?? 0).toFixed(1)} · điểm ${snap.score ?? 0}`, 130, 34, { size: 20 });
  text("WASD đi · E bếp/bàn · C tương phản · R chơi lại", w - 12, h - 14, { size: 18, align: "right", color: "#9fb3c0" });
}

function drawShop(w, h) {
  ctx.fillStyle = highContrast ? "#000000" : "#18242e"; ctx.fillRect(0, 0, w, h);
  text(`CỬA HÀNG NÂNG CẤP NGÀY ${snap.day || 1}`, w / 2, 90, { size: 26, align: "center", color: "#ffe082" });
  text(`Tiền: ${snap.money || 0}k · Điểm: ${snap.score || 0}`, w / 2, 134, { size: 20, align: "center" });
}

function eventLog(w, h) {
  let y = 100;
  log.forEach((row) => {
    text(`t=${row.tick} ${row.name}`, w - 16, y, { size: 18, align: "right", color: "rgba(255,255,255,0.75)" });
    y += 24;
  });
}

function overlay(w, h) {
  if (!snap.finished) return;
  ctx.fillStyle = "rgba(0,0,0,.72)"; ctx.fillRect(0, 0, w, h);
  text(`Tổng kết (reason: ${snap.reason || snap.state})`, w / 2, h / 2 - 20, { size: 30, align: "center", color: "#ffe082" });
  text(`Tiền ${snap.money ?? 0}k · Uy tín ${(snap.reputation ?? 0).toFixed(1)} · Điểm ${snap.score ?? 0} — R chơi lại`, w / 2, h / 2 + 24, { size: 22, align: "center" });
}

function frame() {
  requestAnimationFrame(frame);
  const [w, h] = fit();
  ctx.fillStyle = highContrast ? "#000000" : "#10161c";
  ctx.fillRect(0, 0, w, h);
  if (snap) {
    const p = snap.phase || snap.mode;
    if (p === "quan") drawQuan(w, h);
    else if (p === "shop") drawShop(w, h);
    else drawGather(w, h);
    eventLog(w, h);
    overlay(w, h);
  } else {
    text(offline ? "Không kết nối được máy chủ…" : "Đang tải…", w / 2, h / 2, { align: "center", size: 22 });
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
